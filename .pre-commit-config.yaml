# Run with prek (https://github.com/j178/prek), which implements this config
# format plus the local `builtin` repo used below. Install the hooks once with
# `make init`.
fail_fast: true
repos:
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen

  - repo: local
    hooks:
      # Workflow YAML is not covered by check-yaml alone: the file parses and
      # GitHub still refuses to run it. That is how this repository ended up
      # with a testing-quality workflow that never started a single job (the
      # container image used ${{ env.* }}, which is not available there) and
      # two tag filters written as regex that never matched a tag. actionlint
      # catches both.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
        require_serial: true

      - id: rumdl
        name: rumdl fmt & check
        language: system
        # `entry` is a single command string; a shell metacharacter such as
        # `&&` is passed to rumdl verbatim and read as a filename, which made
        # every markdown commit fail with "File not found: &&". Run the check
        # instead, since it reports the same problems without writing files.
        entry: rumdl check
        files: \.md$
        pass_filenames: true
        require_serial: true
