name: CD # Continuous Deployment or Delivery

on:
    push:
        # Tag filters are glob patterns, not regular expressions: '[v]?[0-9]+\.[0-9]+'
        # is matched literally and never fires. This matches what release.yml
        # already uses, so all release workflows trigger on the same tags.
        # e.g. v2.0.0, v0.2.0-alpha, v0.3.0+build-71edf32
        tags:
            - 'v*.*.*'

jobs:
    dd:
        name: Deploy or Delivery
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
