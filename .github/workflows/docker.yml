name: Build and Push Docker Image

# Two independent defects made this workflow unusable on the one occasion it
# could have run, and one meant it could never run at all:
#
# 1. The tag filter 'v*.*.*' needs two dots; every tag this repository has is
#    'vMAJOR.MINOR' (v2.12, v2.3, v2.4). No tag ever matched — total run count
#    is 0 — so nothing below had ever executed.
# 2. `ghcr.io/pplmx/cu:${GITHUB_REF_NAME:1}` is shell parameter expansion
#    inside `with:`, where no shell runs. The literal string was handed to
#    docker as an image tag, and `${...}` is not a legal tag character, so the
#    build failed with an invalid reference format. It is `${{ github.ref_name }}`
#    in the expression syntax, and the repository is `nova`, not `cu`.
# 3. No `permissions:` block, while the repository's default GITHUB_TOKEN is
#    read-only (`GET /repos/.../actions/permissions/workflow` ->
#    default_workflow_permissions: read). Login succeeded and the push would
#    have been rejected; GHCR needs `packages: write`.
# 4. It ran the image before pushing, and the image's entrypoint aborts without
#    a GPU ("no CUDA-capable device is detected", exit 134). A GPU-less runner
#    cannot smoke test it, so that step is gone rather than left to fail.
# 5. It built linux/arm64 under QEMU. The image carries an amd64 CUDA runtime
#    pulled from nvidia/cuda; emulating arm64 build tooling adds a large,
#    slow, unverified dimension for an image nothing in this repo consumes on
#    arm. Build what the release is for: amd64.
on:
    push:
        tags:
            - 'v[0-9]*'
    # Allow the image to be rebuilt from the branch without cutting a tag.
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    docker:
        name: Build and Push Image
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v5

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Login to GitHub Container Registry
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.repository_owner }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Derive Image Tags
                id: meta
                uses: docker/metadata-action@v5
                with:
                    # Repository-derived, so a rename does not silently leave
                    # images under the old name (this workflow still said `cu`).
                    images: ghcr.io/${{ github.repository }}
                    tags: |
                        type=ref,event=tag
                        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

            # Build without `load: true` plus a separate push: one buildx
            # invocation, pushed straight to the registry. The previous shape
            # built the image twice.
            -   name: Build and Push
                uses: docker/build-push-action@v6
                with:
                    context: .
                    platforms: linux/amd64
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
