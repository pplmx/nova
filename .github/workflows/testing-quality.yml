name: Nova Testing & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Format Check (clang-format)
  # -------------------------------------------------------------------------
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    env:
      # Pinned: `apt install clang-format` picks whatever the runner image
      # happens to prefer, so a runner upgrade could change the expected
      # output without any code change. Delegate the file list and flags to
      # `make fmt-check` so CI and local runs cannot drift apart.
      CLANG_FORMAT_VERSION: '18'
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}

      - name: Check formatting
        run: make fmt-check

  # -------------------------------------------------------------------------
  # Fuzz Corpus Baseline Check
  # -------------------------------------------------------------------------
  fuzz-corpus-baseline:
    name: Fuzz Corpus Baseline
    # Pure file inspection, no GPU, but it ran on a self-hosted runner and
    # none is registered. ubuntu-latest runs it unchanged.
    runs-on: ubuntu-latest
    steps:
      # Full history: the check below diffs against the base commit, and
      # actions/checkout defaults to a shallow single-commit clone where that
      # commit is absent. `git diff` against a missing object exits non-zero,
      # and with `|| true` the deletion check would have silently passed —
      # the same kind of gate that cannot fail as the one being replaced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job used to compare the corpus against a baseline directory it
      # created from that same corpus a step earlier, then filter the copied
      # files by "*<corpus>*" — but the copies are named seed1.bin,
      # seed_reduce.bin and so on, so that filter matched nothing, BASELINE_SIZE
      # was always 0 and the threshold was always 0. The job could not fail no
      # matter what happened to the corpus. Compare against git instead: the
      # committed corpus is the baseline, and the diff against the base commit
      # names the seeds a change deletes.
      - name: Compare Corpus To The Committed Baseline
        run: |
          # The base commit is what the pull request targets, or the previous
          # push on main. For a first push the `before` field is all zeroes.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              base="$(git rev-parse HEAD^)"
              echo "no base commit in the event payload; using HEAD^ ($base)"
              ;;
          esac
          echo "comparing corpus against $base"

          # Fail loudly if the base commit is not in the clone, rather than
          # letting an empty diff read as "nothing was deleted".
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::base commit $base is not present in this clone; cannot verify the corpus"
            exit 1
          fi

          # Seeds that were committed and are now gone are a real regression:
          # libFuzzer loses the coverage those inputs reached. Added seeds are
          # fine, so only deletions are fatal.
          deleted=$(git diff --name-only --diff-filter=D "$base" HEAD -- 'tests/fuzz/corpus')
          if [ -n "$deleted" ]; then
            echo "::error::fuzz seeds were deleted from the corpus:"
            echo "$deleted"
            exit 1
          fi

          for corpus in memory_pool algorithm matmul; do
            count=$(find "tests/fuzz/corpus/$corpus" -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::corpus directory 'tests/fuzz/corpus/$corpus' is empty or missing"
              exit 1
            fi
            echo "$corpus: $count seed(s)"
          done
          echo "Fuzz corpus is intact"

  # -------------------------------------------------------------------------
  # Integration Summary
  # -------------------------------------------------------------------------
  summary:
    name: Integration Summary
    needs: [format-check, fuzz-corpus-baseline]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Testing & Quality Summary"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Format Check (clang-format) | ${{ needs.format-check.result }} |"
          echo "| Fuzz Corpus Baseline | ${{ needs.fuzz-corpus-baseline.result }} |"
          echo ""
          # Only jobs that can actually run on a GitHub-hosted runner are
          # listed here. Everything that needs a GPU (clang-tidy, sanitizers,
          # unit/property/fuzz tests, coverage) was removed from this workflow
          # because the project has no self-hosted runner and GitHub-hosted
          # runners have none. Those checks are run locally; see
          # docs/ci.md.
          FAILED=0
          for result in \
            "${{ needs.format-check.result }}" \
            "${{ needs.fuzz-corpus-baseline.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) FAILED=1 ;;
            esac
          done
          if [ "$FAILED" -eq 0 ]; then
            echo "All executed checks passed."
          else
            echo "Some checks failed. Please review the logs."
            exit 1
          fi
