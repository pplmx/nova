name: Benchmark Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-quick:
    name: Quick Benchmarks (CPU-only validation)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Two of this job's assertions could never pass, so it failed on every
      # pull request:
      #
      # 1. `test -d scripts/benchmark/baselines` asserted on a directory that
      #    is not in the repository and never was; update_baseline.py creates
      #    it at run time. Asserting its presence inverted the contract: a
      #    fresh clone is exactly the state where it is legitimately absent.
      # 2. The cmake configure step ran a project whose `project(... LANGUAGES
      #    CXX CUDA)` line needs nvcc. This runner has no CUDA toolkit, so
      #    configure stopped at "No CMAKE_CUDA_COMPILER could be found", and it
      #    would also have failed on CMake 3.31.6 against a 4.0 minimum.
      #
      # What is left is what a GPU-less runner can honestly check: that the
      # harness and the benchmark sources parse, and that the benchmark
      # directory is wired into the build. Compiling and running them needs a
      # device and stays local (see docs/ci.md).
      - name: Check benchmark files exist
        run: |
          test -f scripts/benchmark/run_benchmarks.py
          test -f benchmark/benchmark_kernels.cu
          test -f benchmark/CMakeLists.txt
          test -f scripts/benchmark/update_baseline.py
          test -f scripts/benchmark/check_baseline_freshness.py

      - name: Validate Python syntax
        run: |
          for script in scripts/benchmark/*.py; do
            python -m py_compile "$script"
          done
          echo "benchmark scripts parse"

      # No `cmake -B` here: see the note above. Checking the benchmark CMake
      # file by parsing the top-level build for its add_subdirectory call is
      # the part that needs no toolchain.
      - name: Check the benchmark target is wired into the build
        run: |
          grep -Eq '^[[:space:]]*add_subdirectory\(benchmark\)' CMakeLists.txt
          grep -Eq 'add_executable\(nova_benchmarks' benchmark/CMakeLists.txt
          echo "benchmark target is wired in"
